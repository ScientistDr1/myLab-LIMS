<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>myLab LIMS</title>
<style>
:root{
  --ink:#102a43;--mut:#486581;--bg:#f0f4f8;--card:#ffffff;--side:#0b2230;
  --acc:#0284c7;--line:#bcccdc;--hi:#dc2626;--lo:#2563eb;--ok:#16a34a;--focus:#0284c7
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0b2230,#1e3a8a)}
.login-box{background:#fff;padding:36px 40px;border-radius:16px;width:min(400px,94vw);box-shadow:0 25px 50px -12px rgba(0,0,0,.4)}
.login-box h1{margin:0 0 6px;font-size:22px;color:var(--side)}
.login-box p{margin:0 0 24px;color:var(--mut);font-size:14px}
.login-box label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:500}
.login-box input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:14px}
.login-box button{width:100%;padding:12px;background:var(--acc);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.login-box button:hover{background:#0369a1}
.login-err{color:var(--hi);font-size:13px;margin-bottom:12px;display:none}
nav{width:250px;background:var(--side);color:#cbd5e1;padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:17px;margin:0 0 4px 8px;color:#fff;line-height:1.3}
nav h1 small{font-size:11px;color:#94a3b8;font-weight:400}
nav .user-info{padding:10px 12px;margin:8px 0 16px;background:#132f42;border-radius:8px;font-size:12px;color:#94a3b8}
nav .user-info b{color:#e2e8f0;display:block;font-size:13px}
nav button{display:flex;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:11px 14px;border-radius:8px;font:inherit;cursor:pointer;font-weight:500;transition:background .15s,color .15s}
nav button.on,nav button:hover{background:#1e3a8a;color:#fff}
nav .logout{margin-top:auto;color:#fca5a5}
nav .logout:hover{background:#7f1d1d;color:#fff}
main{flex:1;padding:28px;min-width:0;overflow-y:auto}
h2{margin:0 0 16px;font-size:24px;color:var(--side)}
h3{margin:20px 0 10px;font-size:18px}
h4{margin:16px 0 8px;font-size:16px}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
button.b{background:var(--acc);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer;font-weight:600;transition:background .15s}
button.b:hover{background:#0369a1}
button.b.g{background:#e2e8f0;color:var(--ink)}
button.b.g:hover{background:#cbd5e1}
button.b.d{background:#fff;color:var(--hi);border:1px solid var(--hi)}
button.b.d:hover{background:#ffeeef}
button.b.s{background:#16a34a}
button.b.s:hover{background:#15803d}
button.b:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
table{border-collapse:collapse;width:100%;text-align:left}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600;background:#f8fafc}
tr.k{cursor:pointer}
tr.k:hover{background:#f1f5f9}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.st b{font-size:28px;display:block;color:var(--side)}
.tag{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.tag.Completed{background:#dcfce7;color:var(--ok)}
.tag.Progress{background:#fef9c3;color:#ca8a04}
.tag.Pending{background:#f1f5f9;color:var(--mut)}
.tag.Reject{background:#fee2e2;color:#b91c1c}
.tag.role{background:#e0f2fe;color:#0369a1;text-transform:capitalize}
.H{color:var(--hi);font-weight:700}.L{color:var(--lo);font-weight:700}.A{color:var(--hi);font-weight:700}
.empty{padding:36px;color:var(--mut);text-align:center;font-style:italic}
dialog{border:0;border-radius:12px;padding:24px;width:min(860px,95vw);max-height:92vh;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);background:#fff;overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f label{display:block;font-size:13px;color:var(--mut);font-weight:500;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%}
.full{grid-column:1/-1}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 16px;max-height:280px;overflow-y:auto;border:1px solid var(--line);padding:12px;border-radius:8px;background:#f8fafc}
.chk label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.chk input[type="checkbox"]{width:18px;height:18px;accent-color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:12px 16px}
summary{cursor:pointer;font-weight:600;color:var(--side)}
#report{display:none}
.muted{color:var(--mut);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge.admin{background:#fef3c7;color:#92400e}
.badge.lab{background:#dcfce7;color:#166534}
.badge.phleb{background:#e0f2fe;color:#075985}
.badge.reception{background:#fce7f3;color:#9d174d}
.badge.cashier{background:#ecfdf5;color:#047857}
.badge.auditor{background:#f3e8ff;color:#6b21a8}
.sig-preview{max-height:60px;max-width:180px;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px}
.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.alert.info{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
.alert.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}

/* ========== PRINT – Letterhead compatible ========== */
@media print{
  @page{margin:0;size:A4}
  html,body{margin:0;padding:0;background:#fff;height:auto}
  nav,main,dialog,#login-screen,#app{display:none!important}
  #report{
    display:block!important;
    padding: 3.8cm 1.8cm 1.5cm 1.8cm;
    font-family: "Times New Roman", Times, serif;
    font-size: 11pt;
    color: #000;
    line-height: 1.35;
    min-height: 100vh;
    box-sizing: border-box;
    position: relative;
  }
  #report.with-lh{
    padding: 0 0 2.2cm 0;
    min-height: 100vh;
    display: flex!important;
    flex-direction: column;
  }
  #report.with-lh .report-body{
    padding: 0.4cm 1.5cm 0.6cm 1.5cm;
    flex: 1 1 auto;
  }
  #report table{width:100%;border-collapse:collapse;margin:8px 0}
  #report th,#report td{border-bottom:1px solid #999;padding:5px 8px;text-align:left;font-size:10.5pt}
  #report th{font-weight:700;background:transparent}
  .H,.L,.A{color:#000!important;font-weight:700}
  .no-print{display:none!important}
  .lh-img{
    width: 100%;
    max-width: 100%;
    height: auto;
    max-height: 4.2cm;
    object-fit: fill;
    object-position: top center;
    display: block;
    margin: 0;
    padding: 0;
  }
  .lh-foot{
    width: 100%;
    max-width: 100%;
    height: auto;
    max-height: 1.8cm;
    object-fit: fill;
    object-position: bottom center;
    display: block;
    margin: 0;
    padding: 0;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
  }
  .report-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin:0 0 12px;font-size:10.5pt}
  .report-meta div{margin:2px 0}
  .report-footer{margin-top:24px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:28px}
  .report-footer .sig-block{text-align:center;min-width:160px}
  .report-footer img.sig{max-height:48px;max-width:150px;display:block;margin:0 auto 4px}
  .report-footer .name{font-weight:700;font-size:10.5pt}
  .report-footer .title{font-size:9pt}
  .report-footer .tests-by{font-size:8pt;color:#444;max-width:180px;margin:0 auto 4px}
}
@media(max-width:800px){
  #app{flex-direction:column}
  nav{width:auto;flex-direction:row;flex-wrap:wrap;gap:6px;padding:12px}
  nav h1{width:100%;margin:0 0 8px}
  nav .user-info{width:100%}
  nav button{width:auto;padding:8px 12px;font-size:14px}
  nav .logout{margin-top:0}
  .f{grid-template-columns:1fr}
}

/* ---- review round: focus, mobile, login, dashboard cards ---- */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;border-radius:6px}
.pw-wrap{position:relative;display:block}.pw-wrap input{padding-right:52px!important;margin-bottom:0;width:100%}.login-box .pw-wrap{margin-bottom:14px}
.pw-wrap .pw-eye,.login-box .pw-wrap .pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px!important;height:36px;min-width:0!important;min-height:0!important;padding:0!important;margin:0;display:flex;align-items:center;justify-content:center;background:transparent!important;border:0!important;border-radius:8px;color:#475569!important;cursor:pointer;line-height:1}
.pw-wrap .pw-eye:hover{background:transparent!important;color:#0f172a!important}
.pw-wrap .pw-eye svg{width:22px;height:22px;display:block;pointer-events:none}
/* hide the browser's own reveal / clear / autofill buttons so only our eye icon shows */
input[type=password]::-ms-reveal{display:none!important;width:0;height:0}
input[type=password]::-ms-clear{display:none!important;width:0;height:0}
input[type=password]::-webkit-credentials-auto-fill-button{visibility:hidden!important;display:none!important;pointer-events:none;position:absolute;right:0}
input[type=password]::-webkit-contacts-auto-fill-button{visibility:hidden!important;display:none!important;pointer-events:none;position:absolute;right:0}
.reg-link{display:block;text-align:center;margin-top:16px;padding:12px 14px;border:2px solid var(--acc,#1b7f92);border-radius:10px;color:var(--acc,#1b7f92);font-weight:700;font-size:15px;text-decoration:none;background:#f0fafb}
.reg-link:hover,.reg-link:focus-visible{background:var(--acc,#1b7f92);color:#fff}
.fe{color:#b3261e;font-size:13px;margin:6px 0;min-height:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0 18px}
.card-btn{text-align:left;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 1px 3px #0001;display:block;width:100%}
.card-btn:hover{border-color:var(--acc,#1b7f92);box-shadow:0 4px 12px #1b7f9230}
.card-btn .n{font-size:34px;font-weight:700;display:block;line-height:1.15}.card-btn .l{color:var(--mut);font-size:14px;display:block}.card-btn .s{font-size:12px;color:var(--mut);display:block;margin-top:2px}
.card-btn.warn .n{color:#b3261e}
.tag.Validation{background:#fff0cf;color:#8a5a00}.tag.Rejected{background:#fee2e2;color:#b91c1c}.badge.mlt{background:#e0f2fe;color:#075985}
@media(max-width:600px){input,select,textarea{font-size:16px!important;min-height:44px}button,.b{min-height:44px}main{padding:12px!important}.f{grid-template-columns:1fr!important}h2{font-size:20px}dialog{width:96vw!important;padding:14px!important}.cards{grid-template-columns:1fr 1fr}.login-box{padding:26px 20px}}
a.b{display:inline-block;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:600;background:var(--acc);color:#fff;margin:0 8px 8px 0}
a.b.g{background:#e2e8f0;color:var(--ink)}a.b:hover{filter:brightness(.95)}
#login-links{margin-top:12px;text-align:center;font-size:13px;line-height:1.9}#login-links a{color:var(--acc);font-weight:600}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>myLab LIMS</h1>
    <p>Laboratory information system</p>
    <div class="login-err" id="login-err"></div>
    <div id="demo-note" style="display:none;background:#fff4d6;color:#7a5b00;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px"><b>Demo server.</b> Data may be erased at any time. Do not enter real patient records.</div>
    <label for="lf">Facility code</label>
    <input id="lf" autocomplete="organization" autocapitalize="none" placeholder="e.g. DH-4821">
    <label>Username</label>
    <input id="lu" autocomplete="username" autocapitalize="none">
    <label>Password</label>
    <input id="lp" type="password" autocomplete="current-password" placeholder="Enter your password">
    <button onclick="doLogin()">Sign In</button>
    <p style="text-align:center;margin:12px 0 0;font-size:14px"><a href="#" onclick="forgotDlg();return false">Forgot password?</a></p>
    <p class="muted" style="margin-top:18px;text-align:center;font-size:12px">
      <a class="reg-link" href="#" onclick="regDlg();return false">New facility? Register here</a>
      <span style="font-size:11px">Staff: ask your facility administrator for the facility code and your login.</span>
      <div id="login-links"></div>
    </p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <nav id="nav" aria-label="Main Navigation"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-modal="true"></dialog>
<div id="report" aria-hidden="true"></div>

<script>
/* ============================================================
   myLab LIMS – Secure Single-File Edition
   Roles: admin | lab (scientist) | phleb (phlebotomist) | auditor
   Features: login, RBAC, audit log, AES encryption of PHI,
             verified backups, user signatures, letterhead print
   ============================================================ */

const K = 'lims_v4_secure';

const SESSION_K = 'lims_session';
const today = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
const e = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Crypto helpers (Web Crypto API) ---------- */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function deriveKey(pass, saltB64){
  const salt = Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encryptText(plain, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, new TextEncoder().encode(plain));
  return btoa(String.fromCharCode(...iv))+'.'+btoa(String.fromCharCode(...new Uint8Array(ct)));
}
async function decryptText(cipher, key){
  const [ivB, ctB] = cipher.split('.');
  const iv = Uint8Array.from(atob(ivB),c=>c.charCodeAt(0));
  const ct = Uint8Array.from(atob(ctB),c=>c.charCodeAt(0));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
  return new TextDecoder().decode(pt);
}
function simpleChecksum(str){
  let h=0;
  for(let i=0;i<str.length;i++) h=((h<<5)-h)+str.charCodeAt(i)|0;
  return (h>>>0).toString(16);
}

/* ---------- Test Catalogue (complete panels from original lab file) ---------- */
const N=(n,u,r,x)=>({n,u,t:'n',r,x});
const S=(n,o,abn=[],x)=>({n,t:'s',o,abn,x});
const T=(n,x)=>({n,t:'t',x});
const any=(a,b)=>[['',0,200,a,b]];
const ad=(a,b,c,d)=>[['',12,200,a,b],['',0,12,c,d]];
const sx=(a,b,c,d,f,g)=>[['M',12,200,a,b],['F',12,200,c,d],['',0,12,f,g]];
const RN=['Non-Reactive','Reactive','Indeterminate'];
const DIP=['Negative','Trace','+','++','+++','++++'];
const TIT=['Nil','1:20','1:40','1:80','1:160','1:320','1:640'];
const AB=['','R','+','++','+++'];
const ABX='Gentamicin,Erythromycin,Streptomycin,Chloramphenicol,Tetracycline,Ampiclox,Ceporex,Nalidixic Acid,Repamin,Azithromycin,Diovid,Ceforaxin,Levofloxacin,Levoxin,Amovic (Augmentin),Pefloxacin,Zinnacef,Amoxicillin,Rocephin,Ciprofloxacin,Tarivid,Sparfloxacin,Avicef,Ceftriaxone tazobactam,Nitrofurantoin,Septrin,Ofloxacin'.split(',');
const ANT=['Paratyphi A','Paratyphi B','Paratyphi C','Typhi D'];
const mk=(name,an)=>({id:name.toLowerCase().replace(/\W+/g,'-'),name,an});
const CAT=[
  mk('Full blood count + differential',[
    N('PCV','%',sx(40,54,36,47,32,42)),
    N('Hb','g/dL',sx(13,18,11.5,15.5,10.7,14.1)),
    N('RBC','×10¹²/L',sx(4.0,5.5,3.5,4.5,4.0,5.2)),
    N('MCV','fL',any(76,93)),
    N('MCH','pg',any(27,33)),
    N('MCHC','g/dL',any(31,35)),
    N('PLT','×10⁹/L',any(150,400)),
    N('WBC','×10⁹/L',any(4.0,11.0)),
    N('Neutrophils','%',any(40,75)),
    N('Lymphocytes','%',any(20,40)),
    N('Monocytes','%',any(2,10)),
    N('Eosinophils','%',any(1,6)),
    N('Basophils','%',any(0,1)),
    T('Remark')
  ]),
  mk('Haemoglobin (Hb)',[N('Hb','g/dL',sx(13,18,11.5,15.5,10.7,14.1))]),
  mk('PCV',[N('PCV','%',sx(40,54,36,47,32,42))]),
  mk('PCV + Haemoglobin',[
    N('PCV','%',sx(40,54,36,47,32,42)),
    N('Hb','g/dL',sx(13,18,11.5,15.5,10.7,14.1))
  ]),
  mk('Malaria parasite (MP)',[
    S('M.P',['No Malaria Parasite Seen','Trophozoite of P. falciparum (+) seen'],['Trophozoite of P. falciparum (+) seen']),
    N('Parasite density','p/µL')
  ]),
  mk('Widal',[
    ...ANT.map(a=>S('O – S. '+a,TIT,TIT.slice(4),'>1:80 significant')),
    ...ANT.map(a=>S('H – S. '+a,TIT,TIT.slice(4),'>1:80 significant'))
  ]),
  mk('Genotype',[S('Genotype',['AA','AS','SS','AC','SC','CC'])]),
  mk('Blood group',[S('Blood group',[
    'A Rh D Positive','A Rh D Negative',
    'B Rh D Positive','B Rh D Negative',
    'AB Rh D Positive','AB Rh D Negative',
    'O Rh D Positive','O Rh D Negative'
  ])]),
  mk('HBsAg',[S('HBsAg',RN,['Reactive'])]),
  mk('HBV Profile',[
    S('HBsAg',RN,['Reactive']),
    S('HBsAb',RN,['Reactive']),
    S('HBeAg',RN,['Reactive']),
    S('HBeAb',RN,['Reactive']),
    S('HBcAb',RN,['Reactive'])
  ]),
  mk('HCV',[S('HCV',RN,['Reactive'])]),
  mk('RVS',[S('RVS',RN,['Reactive'])]),
  mk('VDRL',[S('VDRL',RN,['Reactive'])]),
  mk('H. pylori',[S('H. pylori',RN,['Reactive'])]),
  mk('Serum PT',[S('Serum PT',['Negative','Positive','Indeterminate'],['Positive'])]),
  mk('Random blood sugar (RBS)',[N('RBS','mmol/L',any(3,9))]),
  mk('Fasting blood sugar (FBS)',[N('FBS','mmol/L',any(3,6))]),
  mk('HbA1c',[N('HbA1c','%',any(3.8,5.8))]),
  mk('Insulin',[N('Insulin','µIU/mL',any(2.3,11.6))]),
  mk('Urinalysis',[
    T('Colour'),
    S('Consistency',['Clear','Slightly cloudy','Cloudy','Turbid']),
    ...['Glucose','Urobilinogen','Bilirubin','Blood','Ketone','Protein','Nitrite','Leukocyte'].map(n=>S(n,DIP)),
    T('pH'),
    T('Specific gravity'),
    ...['Ascorbic acid','Creatinine','Calcium','Micro albumin'].map(n=>S(n,DIP))
  ]),
  mk('Liver function test (LFT)',[
    N('Total bilirubin','µmol/L',any(2,20.5)),

const COLL={patients:()=>db.patients,orders:()=>db.orders,pay:()=>db.pay,qcmats:()=>db.qc.mats,qcruns:()=>db.qc.runs,tests:()=>db.tests,audit:()=>db.audit,brand:()=>db.brand,resetreq:()=>db.resetreq};

async function api(path,body){
  let r;
  try{ r=await fetch('/api'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body===undefined?undefined:JSON.stringify(body)}); }
  catch(_){ throw new Error('Cannot reach the server'); }
  let j={}; try{ j=await r.json(); }catch(_){}
  if(r.status===401 && TOKEN && path!=='/login') endSession('Your session has ended. Please sign in again.');
  if(!r.ok){ const er=new Error(j.error||('Server error '+r.status)); er.status=r.status; throw er; }
  return j;
}
function ensureNew(){
  db.qc=db.qc||{mats:[],runs:[]};
  if(db.printMode===undefined) db.printMode='blank';
  if(db.letterhead===undefined) db.letterhead='';
  if(db.letterfoot===undefined) db.letterfoot='';
  db.pay=db.pay||[];
  db.tests.forEach(t=>{ if(t.price===undefined) t.price=0; });
  // Ensure Indeterminate on Reactive/Positive choice lists
  db.tests.forEach(t=>{
    (t.an||[]).forEach(a=>{
      if(a.t!=='s' || !Array.isArray(a.o)) return;
      const low=a.o.map(x=>String(x).toLowerCase());
      const hasReact = low.some(x=>x.includes('reactive')||x==='positive');
      const hasInd = low.some(x=>x.includes('indeterminate'));
      if(hasReact && !hasInd) a.o.push('Indeterminate');
    });
  });
  // Ensure HBV Profile panel exists with individual parameters
  if(!db.tests.some(t=>t.id==='hbv-profile'||t.name==='HBV Profile')){
    db.tests.push({
      id:'hbv-profile',
      name:'HBV Profile',
      price:0,
      an:[
        {n:'HBsAg',t:'s',o:['Non-Reactive','Reactive','Indeterminate'],abn:['Reactive']},
        {n:'HBsAb',t:'s',o:['Non-Reactive','Reactive','Indeterminate'],abn:['Reactive']},
        {n:'HBeAg',t:'s',o:['Non-Reactive','Reactive','Indeterminate'],abn:['Reactive']},
        {n:'HBeAb',t:'s',o:['Non-Reactive','Reactive','Indeterminate'],abn:['Reactive']},
        {n:'HBcAb',t:'s',o:['Non-Reactive','Reactive','Indeterminate'],abn:['Reactive']}
      ]
    });
  }
  // Ensure combined PCV + Haemoglobin panel exists
  if(!db.tests.some(t=>t.id==='pcv-haemoglobin'||t.name==='PCV + Haemoglobin')){
    db.tests.push({
      id:'pcv-haemoglobin',
      name:'PCV + Haemoglobin',
      price:0,
      an:[
        {n:'PCV',u:'%',t:'n',r:[['M',12,200,40,54],['F',12,200,36,47],['',0,12,32,42]]},
        {n:'Hb',u:'g/dL',t:'n',r:[['M',12,200,13,18],['F',12,200,11.5,15.5],['',0,12,10.7,14.1]]}

}

function applyState(s){
  REV=s.rev; const d=s.data, m=(d.meta||[])[0], b=(d.bk||[])[0];
  db={lab:m?m.lab:(session.role==='admin'?'KATCHA MEDICAL SERVICES':'Laboratory'),pre:m?m.pre||'':'',signer:m?m.signer||'':'',printMode:m?m.printMode||'blank':'blank',brand:d.brand||[],_mv:m?m._v:undefined,
    settings:{backupIntervalDays:1,encEnabled:false,lastBackup:b?b.when:null,lastBackupChecksum:b?b.sha256:null,backupOk:b?b.ok:null},
    patients:d.patients||[],orders:d.orders||[],pay:d.pay||[],qc:{mats:d.qcmats||[],runs:d.qcruns||[]},tests:d.tests||[],users:d.users||[],audit:d.audit||[],resetreq:d.resetreq||[]};
  defineBrand();
  SNAP={}; for(const c in ARRS){ SNAP[c]={}; ARRS[c]().forEach(r=>SNAP[c][r.id]=JSON.stringify(r)); }
  SNAP.meta=m?JSON.stringify(metaDoc()):null;
  if(session.role==='admin') CAT.forEach(c=>{ if(!db.tests.some(t=>t.id===c.id)) db.tests.push(JSON.parse(JSON.stringify(c))); });
  ensureNew();
}
function persist(){ dirty=true; clearTimeout(persist.t); persist.t=setTimeout(flush,100); setSync(); }
async function flush(){
  if(flushing||!session||!db) return; flushing=true;
  try{
    for(;;){
      const ch=[], live=[], w=(WRITE[session.role]||'').split(' ');
      for(const c in COLL){
        if(!w.includes(c)) continue;
        const cur={}; COLL[c]().forEach(r=>cur[r.id]=r);
        for(const id in cur){ const s=JSON.stringify(cur[id]); if(APPEND.includes(c)?!(id in SNAP[c]):SNAP[c][id]!==s){ ch.push({c,id,op:'upsert',doc:JSON.parse(s)}); live.push(cur[id]); } }
        if(!APPEND.includes(c)) for(const id in SNAP[c]) if(!cur[id]){ ch.push({c,id,op:'delete'}); live.push(null); }
      }
      if(w.includes('meta')){ const m=JSON.stringify(metaDoc()); if(SNAP.meta!==m){ ch.push({c:'meta',id:'meta',op:'upsert',doc:JSON.parse(m)}); live.push(null); } }
      if(!ch.length) break;
      const res=await api('/push',{changes:ch}); offline=false;
      ch.forEach((x,i)=>{
        const v=res.vers[i];
        if(x.op==='delete'){ delete SNAP[x.c][x.id]; return; }
        const cl=Object.assign({},x.doc,{_v:v});
        if(x.c==='meta'){ db._mv=v; SNAP.meta=JSON.stringify(cl); return; }
        if(ARRS[x.c]().find(r=>r.id===x.id)===live[i]){ live[i]._v=v; SNAP[x.c][x.id]=JSON.stringify(cl); }
      });
    }
    dirty=false;
  }catch(err){
    if(err.status && err.status!==401){ alert('Your last change was not saved: '+err.message+'\nThe latest data from the server will now be loaded.'); try{ await resync(); }catch(_){} dirty=false; }
    else if(!err.status){ offline=true; clearTimeout(retryT); retryT=setTimeout(flush,3000); }
  }finally{ flushing=false; setSync(); }
}
async function resync(){ applyState(await api('/state')); if(dlg.open) dlg.close(); render(); }
function setSync(){
  const el=document.getElementById('syncind'); if(!el) return;
  const live=ES&&ES.readyState===1;
  el.textContent=offline?'● Offline – retrying':dirty?'● Saving…':live?'● Live':'● Reconnecting…';
  el.style.color=offline?'#f87171':dirty?'#fbbf24':live?'#4ade80':'#fbbf24';
}
function connect(){
  if(ES) ES.close();
  ES=new EventSource('/api/events?t='+encodeURIComponent(TOKEN));
  ES.onmessage=()=>pull(); ES.onopen=()=>{ pull(); setSync(); }; ES.onerror=()=>setSync();
}
async function pull(){
  if(!session) return; if(pulling){ again=true; return; } pulling=true;
  try{ applyChanges(await api('/changes?since='+REV)); }catch(_){}
  pulling=false; if(again){ again=false; pull(); }
}
function applyChanges(r){
  let ch=false;
  for(const c in r.up) r.up[c].forEach(d=>{
    if(c==='meta'){ if(!(db._mv>=d._v)){ db.lab=d.lab||db.lab; db.pre=d.pre||''; db.signer=d.signer||''; db.printMode=d.printMode||'blank'; db._mv=d._v; SNAP.meta=JSON.stringify(metaDoc()); ch=true; } return; }
    if(c==='bk'){ db.settings.lastBackup=d.when; db.settings.lastBackupChecksum=d.sha256; db.settings.backupOk=d.ok; ch=true; return; }
    const arr=ARRS[c]&&ARRS[c](); if(!arr) return;
    const i=arr.findIndex(x=>x.id===d.id);
    if(i<0){ if(c==='audit') arr.unshift(d); else arr.push(d); SNAP[c][d.id]=JSON.stringify(d); ch=true; }
    else if(d._v>(arr[i]._v||0)){ arr[i]=d; SNAP[c][d.id]=JSON.stringify(d); ch=true; }
  });
  for(const c in r.del) r.del[c].forEach(id=>{
    const arr=ARRS[c]&&ARRS[c](); if(!arr) return;
    const i=arr.findIndex(x=>x.id===id); if(i>=0){ arr.splice(i,1); ch=true; }
    if(SNAP[c]) delete SNAP[c][id];
  });
  REV=r.rev;
  if(ch){ if(dlg.open) stale=true; else render(); }
}

  db.audit.unshift({id:uid(),ts:nowISO(),user:session.username,role:session.role,action,details:String(details).slice(0,500)});
  persist();
}

/* ---------- Encryption of patient PHI ---------- */
async function ensureEncKey(passphrase){
  if(!db.settings.encSalt){
    db.settings.encSalt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
  }
  encKey = await deriveKey(passphrase, db.settings.encSalt);
  db.settings.encEnabled = true;
  persist();
}

async function encryptPatient(p){
  if(!encKey || !db.settings.encEnabled) return p;
  const copy = {...p};
  for(const f of ['name','phone','addr','dob']){
    if(copy[f] && !String(copy[f]).startsWith('ENC:')){
      copy[f] = 'ENC:' + await encryptText(String(copy[f]), encKey);
    }
  }
  return copy;
}
async function decryptPatient(p){
  if(!encKey || !db.settings.encEnabled) return p;
  const copy = {...p};
  for(const f of ['name','phone','addr','dob']){
    if(copy[f] && String(copy[f]).startsWith('ENC:')){
      try{ copy[f] = await decryptText(copy[f].slice(4), encKey); }
      catch(_){ copy[f] = '[encrypted]'; }
    }
  }
  return copy;
}
async function getPatients(){
  const list = [];
  for(const p of db.patients) list.push(await decryptPatient(p));
  return list;
}
async function getPatient(id){
  const p = db.patients.find(x=>x.id===id);
  return p ? await decryptPatient(p) : null;
}

/* ---------- Helpers ---------- */
function hasAge(p){ return p && p.age!==undefined && p.age!==null && p.age!=='' && !isNaN(parseFloat(p.age)); }
function ageYears(p){
  if(p && p.ageY!=null && !isNaN(p.ageY)) return parseFloat(p.ageY);
  if(hasAge(p)) return p.au==='m' ? parseFloat(p.age)/12 : parseFloat(p.age);
  if(p && p.dob){ const d=new Date(p.dob); if(!isNaN(d)) return (Date.now()-d)/31557600000; }
  return 30; // unknown age: adult range
}
function ageParts(p){ // {n, u} as entered, or derived from an old date of birth
  if(hasAge(p)) return {n:parseInt(p.age), u:p.au==='m'?'m':'y'};
  if(p && p.dob && !isNaN(new Date(p.dob))){ const y=ageYears(p); return y<2?{n:Math.floor(y*12),u:'m'}:{n:Math.floor(y),u:'y'}; }
  return null;
}
function ageText(p){ const a=ageParts(p); return a? a.n+(a.u==='m'?' mths':' yrs') : ''; }
function ageSex(p){ const a=ageText(p); return a ? `${a} / ${p.sex||''}` : (p?.sex||''); }
function hasResults(o){ return !!(o.results && Object.values(o.results).some(r=>r && Object.keys(r).some(k=>k!=='_meta'&&k!=='Remark'&&r[k]!==''&&r[k]!=null))); }
function statusOf(o){
  if(o.rejected) return 'Rejected';
  if(o.validated) return 'Completed';
  return hasResults(o) ? 'Validation' : 'Pending';
}
const ST_LABEL={Pending:'Pending',Validation:'Awaiting validation',Completed:'Released',Rejected:'Rejected'};
const stLabel=s=>ST_LABEL[s]||s;
const tatOf=t=>(t&&+t.tat>0)?+t.tat:24;
function receivedAt(o){ return new Date((o.sample&&o.sample.collected&&o.sample.collectedAt)||o.created||o.date||Date.now()); }
function isOverdue(o){
  const s=statusOf(o); if(s==='Completed'||s==='Rejected') return false;
  const hs=(o.tests||[]).map(tid=>tatOf(db.tests.find(x=>x.id===tid))), h=hs.length?Math.max(...hs):24;
  return Date.now()-receivedAt(o) > h*3600000;
}
function flag(val, analyte, patient){
  if(analyte.t!=='n'||val===''||val==null) return '';
  if(/^[<>]/.test(String(val))) return ''; // allow free-text inequalities
  const num = parseFloat(val); if(isNaN(num)) return '';
  const sex = (patient?.sex||'').toUpperCase().startsWith('M')?'M':(patient?.sex||'').toUpperCase().startsWith('F')?'F':'';
  const age = ageYears(patient);
  for(const [s,amin,amax,lo,hi] of (analyte.r||[])){
    if(s && s!==sex) continue;
    if(age < amin || age >= amax) continue; // upper bound exclusive (matches original)
    if(lo != null && num < lo) return 'L';
    if(hi != null && num > hi) return 'H';
    return '';
  }
  return '';
}
function isAbnormal(val, analyte){
  return analyte.t==='s' && analyte.abn && analyte.abn.includes(val);
}
function refText(analyte, patient){
  const sex = (patient?.sex||'').toUpperCase().startsWith('M')?'M':(patient?.sex||'').toUpperCase().startsWith('F')?'F':'';
  const age = ageYears(patient);
  const rules = analyte.r||[];
  const r = rules.find(([s,amin,amax]) => (!s||s===sex) && age>=amin && age<amax) || rules[0];
  if(r){
    const [, , , lo, hi] = r;
    if(lo != null && hi != null) return lo+' – '+hi;
    if(hi == null && lo != null) return '≥ '+lo;
    if(lo == null && hi != null) return '≤ '+hi;
  }
  // Fall back to note only if it is a real reference note (not an "Auto:" formula)
  if(analyte.x && !String(analyte.x).startsWith('Auto')) return analyte.x;
  return '';
}

async function savePatient(id){
  if(!can('patients.edit') && !can('*')) return alert('Access denied');
  const name = document.getElementById('pn').value.trim();
  if(!name) return alert('Name is required');
  const ageRaw = document.getElementById('pd').value.trim(), au = document.getElementById('pu').value;
  const ageN = Number(ageRaw);
  if(ageRaw==='' || !Number.isInteger(ageN) || ageN<0) return alert('Enter the age as a whole number.');
  if(au==='m' && ageN>=24) return alert('Use years for ages of 2 or more.');
  if(au==='y' && ageN>120) return alert('Check the age entered.');
  const data = {
    name,
    phone: document.getElementById('pp').value.trim(),
    sex: document.getElementById('ps').value,
    age: ageN, au,
    dob: '', // date of birth is no longer collected
    addr: document.getElementById('pa').value.trim()
  };
  if(id){
    const idx = db.patients.findIndex(x=>x.id===id);
    if(idx<0) return;
    const encrypted = await encryptPatient({...db.patients[idx], ...data});
    db.patients[idx] = encrypted;
    log('PATIENT_UPDATE', `Updated patient ${id} (${name})`);
  } else {
    let pn; try{ pn=(await api('/next',{name:'p'})).n; }catch(ex){ return alert('Cannot reach the server: '+ex.message); }
    const raw = {
      id: uid(),
      pid: 'P'+String(pn).padStart(4,'0'),
      reg: today(),
      ...data
    };
    db.patients.push(await encryptPatient(raw));
    log('PATIENT_CREATE', `Created patient ${raw.pid} (${name})`);
  }
  persist();
  closeDlg();
  render();
}

async function enterResults(id){
  if(!can('results.edit')&&!can('*')) return alert('Access denied');
  const o = db.orders.find(x=>x.id===id);
  if(!o) return;
  const p = await getPatient(o.pid);
  if(o.rejected) return alert('This sample was rejected ('+o.rejected.reason+'). Undo the rejection first if it should be tested.');
  o.results = o.results||{};
  window._resultPatientAge = ageYears(p);
  window._resultPatientFemale = ((p?.sex||'').toUpperCase().startsWith('F'));

  let html = `<h3>Results – ${e(o.oid)} / ${e(p?.name||'')}</h3>
    <p class="muted">Calculated fields (MCV, MCH, MCHC, RDW-CV/RDW-SD, BUN, ratio, eGFR) fill automatically. Remarks are written manually by a Medical Laboratory Scientist.${o.validated?' <b>These results are validated and locked.</b>':''}</p>`;
  (o.tests||[]).forEach(tid=>{
    const t = db.tests.find(x=>x.id===tid);
    if(!t) return;
    o.results[tid] = o.results[tid]||{};
    html += `<details open data-tid="${tid}"><summary>${e(t.name)}</summary><div class="f">`;
    if(/renal/i.test(t.name)) html += `<div class="full"><button type="button" class="b g" onclick="recalcRenal('${tid}')">Recalculate BUN, BUN:Creatinine ratio &amp; eGFR</button> <span class="muted">uses Urea, Creatinine and the patient's age and sex</span></div>`;
    if(/renal/i.test(t.name)){
      if(window._resultPatientAge<18) html += `<div><label>Height (cm) – children, for eGFR</label><input type="number" step="any" data-tid="${tid}" data-an="Height (cm)" value="${e(o.results[tid]['Height (cm)']??'')}" oninput="onResultInput(this,'${tid}')"></div>`;
      html += `<div class="full muted" id="egfrnote-${tid}" style="font-size:13px"></div>`;
    }
    t.an.forEach(a=>{
      const val = o.results[tid][a.n]??'';
      const hint = a.x ? ` <span class="muted">(${e(a.x)})</span>` : '';
      if(a.t==='s'){
        html += `<div><label>${e(a.n)}${hint}</label>
          <select data-tid="${tid}" data-an="${e(a.n)}" onchange="onResultInput(this,'${tid}')">
            <option value="">—</option>
            ${a.o.map(opt=>`<option value="${e(opt)}" ${val===opt?'selected':''}>${e(opt)}</option>`).join('')}
          </select></div>`;
      } else if(a.t==='n'){
        const isPcvHb = (t.id==='pcv-haemoglobin' || t.name==='PCV + Haemoglobin');
        const autoHb = isPcvHb && a.n==='PCV';
        html += `<div><label>${e(a.n)} ${a.u?'('+e(a.u)+')':''}${hint}${autoHb?' <span class="muted">(Hb = PCV÷3)</span>':''}</label>
          <input type="number" step="any" data-tid="${tid}" data-an="${e(a.n)}" value="${e(val)}"
            oninput="${autoHb?`autoHbFromPcv(this,'${tid}')`:`onResultInput(this,'${tid}')`}"></div>`;
      } else if(a.n==='Remark'){
        html += `<div class="full"><label>Remark (written by a Medical Laboratory Scientist)</label>
          <textarea data-tid="${tid}" data-an="Remark" rows="2" style="width:100%" oninput="markRemarkManual(this)">${e(val)}</textarea></div>`;
      } else {
        html += `<div class="full"><label>${e(a.n)}${hint}</label>
          <input data-tid="${tid}" data-an="${e(a.n)}" value="${e(val)}" oninput="onResultInput(this,'${tid}')"></div>`;
      }
    });
    // Ensure remark exists for every test panel
    if(!(t.an||[]).some(a=>a.n==='Remark')){
      const val = o.results[tid]['Remark']??'';
      html += `<div class="full"><label>Remark (written by a Medical Laboratory Scientist)</label>
        <textarea data-tid="${tid}" data-an="Remark" rows="2" style="width:100%" oninput="markRemarkManual(this)">${e(val)}</textarea></div>`;
    }
    html += `</div></details>`;
  });
  const canVal = can('results.validate')||can('*'), locked = !!o.validated;
  html += `
    <div class="bar" style="margin-top:16px">
      ${locked?`<span class="tag Completed">Released – validated by ${e(o.validated.name)}</span>${canVal?` <button class="b d" onclick="revokeValidation('${o.id}')">Revoke validation</button>`:''}`
        :`<button class="b" onclick="saveResults('${o.id}')">Save Results</button>${canVal?` <button class="b s" onclick="validateOrder('${o.id}')">Validate &amp; Release Result</button>`:' <span class="muted">A Medical Laboratory Scientist reviews, writes remarks and releases the report.</span>'}`}
      <button class="b g" data-close>Close</button>
    </div>`;
  openDlg(html);
  (o.tests||[]).forEach(tid=>autoCalcResults(tid));
  document.querySelectorAll('#dlg textarea[data-an="Remark"]').forEach(el=>{ el.disabled = locked || !canVal; });
  if(locked) document.querySelectorAll('#dlg [data-tid]').forEach(el=>{ el.disabled = true; });
}

/** Button: force BUN, BUN:Creatinine ratio and eGFR to be recalculated from Urea / Creatinine */
function recalcRenal(tid){
  const val = n => { const el=getResInput(tid,n); return el && el.value!=='' ? parseFloat(el.value) : NaN; };
  const clear = n => { const el=getResInput(tid,n); if(el){ el.value=''; el.dataset.manual=''; el.dataset.auto=''; } };
  const u = val('Urea'), c = val('Creatinine');
  if(!isNaN(u)) clear('BUN (Blood Urea Nitrogen)');
  if(!isNaN(u) || !isNaN(c)) clear('BUN (Creatinine Ratio)');
  if(!isNaN(c)) clear('eGFR');
  autoCalcResults(tid);
}

function autoHbFromPcv(el, tid){
  const pcv = parseFloat(el.value);
  const hbEl = document.querySelector('#dlg input[data-tid="'+tid+'"][data-an="Hb"]');
  if(!hbEl) return;
  if(el.value==='' || isNaN(pcv)) return;
  hbEl.value = (Math.round((pcv/3)*10)/10).toFixed(1);
  autoCalcResults(tid);
}

function getResInput(tid, name){
  return [...document.querySelectorAll('#dlg [data-tid]')].find(el => el.dataset.tid===tid && el.dataset.an===name) || null;
}

function setResVal(tid, name, val, force){
  const el = getResInput(tid, name);
  if(!el) return;
  if(!force && el.dataset.manual==='1' && el.value!=='') return;
  if(val===''||val==null||isNaN(val)) return;
  el.value = (typeof val==='number') ? (Math.round(val*100)/100) : val;
  el.dataset.auto = '1';
}

/** Auto indices for FBC and Renal; then refresh remark */
function autoCalcResults(tid){
  const tdef = db.tests.find(x=>x.id===tid);
  if(!tdef) return;
  const g = n => {
    const el = getResInput(tid, n);
    if(!el || el.value==='') return NaN;
    return parseFloat(el.value);
  };

  // --- FBC: MCV, MCH, MCHC ---
  const pcv = g('PCV'), hb = g('Hb'), rbc = g('RBC');
  if(!isNaN(pcv) && !isNaN(rbc) && rbc>0){
    // MCV (fL) = (PCV % / RBC 10^12/L) × 10
    setResVal(tid, 'MCV', (pcv/rbc)*10);
  }
  if(!isNaN(hb) && !isNaN(rbc) && rbc>0){
    // MCH (pg) = (Hb g/dL / RBC) × 10
    setResVal(tid, 'MCH', (hb/rbc)*10);
  }
  if(!isNaN(hb) && !isNaN(pcv) && pcv>0){
    // MCHC (g/dL) = (Hb / PCV) × 100
    setResVal(tid, 'MCHC', (hb/pcv)*100);
  }

  // --- Renal: BUN, BUN:Creatinine ratio, eGFR ---
  // CKD-EPI 2021 for adults (18+); bedside Schwartz for children (needs height). Field names matched loosely.
  const rn = re => { const el=[...document.querySelectorAll('#dlg [data-tid]')].find(x=>x.dataset.tid===tid && re.test(x.dataset.an||'')); return el?el.dataset.an:null; };
  const nUrea=rn(/^urea$/i), nCr=rn(/^creatinine/i), nBun=rn(/^bun \(blood/i), nRat=rn(/ratio/i), nEg=rn(/^egfr/i);
  const urea = nUrea?g(nUrea):NaN, creat = nCr?g(nCr):NaN;
  if(nBun && !isNaN(urea)) setResVal(tid, nBun, urea*2.8);                       // BUN mg/dL = Urea mmol/L x 2.8
  const bun = nBun?g(nBun):NaN;
  if(nRat && !isNaN(bun) && !isNaN(creat) && creat>0) setResVal(tid, nRat, bun/creat);
  let msg = '';
  if(nEg && !isNaN(creat) && creat>0){
    const age = window._resultPatientAge, female = !!window._resultPatientFemale;
    if(creat>15){
      msg = 'Creatinine '+creat+' looks like µmol/L. eGFR needs mg/dL (divide µmol/L by 88.4).';
    } else if(age!=null && age>=18){
      const k = female?0.7:0.9, al = female?-0.241:-0.302;
      const egfr = 142 * Math.pow(Math.min(creat/k,1), al) * Math.pow(Math.max(creat/k,1), -1.200) * Math.pow(0.9938, age) * (female?1.012:1);
      setResVal(tid, nEg, Math.round(egfr));
      msg = 'eGFR by CKD-EPI 2021 (age '+Math.round(age)+' y, '+(female?'female':'male')+').';
    } else if(age!=null){
      const hEl = getResInput(tid,'Height (cm)'), h = hEl?parseFloat(hEl.value):NaN;
      if(h>0){ setResVal(tid, nEg, Math.round(0.413*h/creat)); msg='eGFR by bedside Schwartz (child, height '+h+' cm).'; }
      else msg='Patient is under 18. Enter height (cm) above to calculate eGFR (bedside Schwartz).';
    }
  }
  const noteEl = document.getElementById('egfrnote-'+tid); if(noteEl) noteEl.textContent = msg;

  autoRemark(tid);
}

function autoRemark(tid){ return; /* remarks are written manually by a Medical Laboratory Scientist */
  const remarkEl = getResInput(tid, 'Remark');
  // If no Remark field, create nothing; some tests have Remark as T type
  const tdef = db.tests.find(x=>x.id===tid);
  if(!tdef) return;
  const hasRemark = (tdef.an||[]).some(a=>a.n==='Remark');
  // Always ensure a remark box exists via data attribute on a dedicated field
  let box = document.querySelector('#dlg textarea[data-tid="'+tid+'"][data-an="Remark"]')
         || document.querySelector('#dlg input[data-tid="'+tid+'"][data-an="Remark"]')
         || document.getElementById('autoRemark_'+tid);
  if(!box){
    // inject editable remark area at end of this test's details if missing
    const details = document.querySelector('#dlg details[data-tid="'+tid+'"]') || 
      [...document.querySelectorAll('#dlg details')].find(d => d.querySelector('[data-tid="'+tid+'"]'));
    if(details){
      const wrap = document.createElement('div');
      wrap.className = 'full';
      wrap.style.gridColumn = '1 / -1';
      wrap.innerHTML = `<label>Remark (written by a Medical Laboratory Scientist)</label>
        <textarea id="autoRemark_${tid}" data-tid="${tid}" data-an="Remark" rows="2" style="width:100%"></textarea>`;
      details.querySelector('.f')?.appendChild(wrap);
      box = wrap.querySelector('textarea');
    }
  }
  if(!box) return;
  // Don't overwrite if user manually edited after auto
  if(box.dataset.manual==='1') return;

  const p = { sex: window._resultPatientFemale ? 'Female' : 'Male', ageY: window._resultPatientAge };
  const bits = [];
  (tdef.an||[]).forEach(a=>{
    if(a.n==='Remark') return;
    const el = getResInput(tid, a.n);
    if(!el || el.value==='') return;
    const val = el.value;
    if(a.t==='n'){
      const fl = flag(val, a, {sex: p.sex, age: p.ageY, ageY: p.ageY});
      // ageYears uses patient.dob or age fields – pass synthetic
      const fl2 = flag(val, a, synthPatient(p.sex, p.ageY));
      if(fl2==='L') bits.push(`Low ${a.n} (${val}${a.u?' '+a.u:''})`);
      else if(fl2==='H') bits.push(`High ${a.n} (${val}${a.u?' '+a.u:''})`);
    } else if(a.t==='s' && a.abn && a.abn.includes(val)){
      bits.push(`${a.n}: ${val}`);
    }
  });

  // Morphology-style hints for FBC
  const name = (tdef.name||'').toLowerCase();
  if(name.includes('full blood') || name.includes('fbc')){
    const mcv = parseFloat(getResInput(tid,'MCV')?.value);
    const mch = parseFloat(getResInput(tid,'MCH')?.value);
    const mchc = parseFloat(getResInput(tid,'MCHC')?.value);
    const hb = parseFloat(getResInput(tid,'Hb')?.value);
    if(!isNaN(hb) && flag(hb, (tdef.an.find(a=>a.n==='Hb')||{t:'n',r:[]}), synthPatient(p.sex, p.ageY))==='L'){
      let morph = '';
      if(!isNaN(mcv) && mcv<76) morph = 'microcytic';
      else if(!isNaN(mcv) && mcv>93) morph = 'macrocytic';
      else morph = 'normocytic';
      if(!isNaN(mchc) && mchc<31) morph += ' hypochromic';
      else if(!isNaN(mch) && mch<27) morph += ' hypochromic';
      else morph += ' normochromic';
      bits.unshift(`Suggests ${morph} anemia`);
    }
  }

  const text = bits.length ? bits.join('. ') + '.' : 'All reported parameters within reference range.';
  box.value = text;
}

function synthPatient(sex, ageY){
  return { sex: sex||'', age: ageY, ageY: ageY, ageUnit: 'y' };
}

function onResultInput(el, tid){
  el.dataset.manual = el.dataset.auto==='1' ? '' : '1';
  // if user types in auto field, mark manual
  if(['MCV','MCH','MCHC','BUN (Blood Urea Nitrogen)','BUN (Creatinine Ratio)','eGFR'].includes(el.dataset.an)){
    el.dataset.manual = '1';
  }
  autoCalcResults(tid);
}

function markRemarkManual(el){
  el.dataset.manual = '1';
}

function saveResults(id){
  if(!can('results.edit')&&!can('*')) return alert('Access denied');
  const o = db.orders.find(x=>x.id===id);
  if(!o) return;
  if(o.validated) return alert('Validated results are locked. A Medical Laboratory Scientist must revoke the validation before they can be edited.');
  o.results = o.results||{};
  const touched = new Set();
  document.querySelectorAll('#dlg [data-tid]').forEach(el=>{
    const tid = el.dataset.tid;
    const an = el.dataset.an;
    if(!an) return;
    o.results[tid] = o.results[tid]||{};
    o.results[tid][an] = el.value;
    if(el.value!=='' && el.value!=null) touched.add(tid);
  });
  touched.forEach(tid=>{
    const res = o.results[tid];
    const hasVal = Object.keys(res).some(k=>k!=='_meta' && res[k]!=='' && res[k]!=null);
    if(!hasVal) return;
    res._meta = {
      by: session.username,
      name: session.name || session.username,
      initials: session.initials || '',
      signature: session.signature || '',
      role: session.role,
      at: nowISO()
    };
  });
  o.updated = nowISO();
  o.updatedBy = session.username;
  log('RESULTS_SAVE', `Saved results for order ${o.oid} by ${session.username}`);
  persist();
  closeDlg();
  render();
}

/* ---------- Print / Export (letterhead, PDF, JPG, per-scientist sign) ---------- */

function testHasResults(res, test){
  if(!res) return false;
  return (test.an||[]).some(a => res[a.n]!==undefined && res[a.n]!=='');
}

function safeFileName(name){
  return String(name||'patient').replace(/[^\w\s\-().]/g,'').replace(/\s+/g,'_').slice(0,60) || 'patient';
}

function buildReportHtml(o, p, opts={}){
  if(!o.validated) return null;
  const useLh = !!(db.letterhead && db.printMode !== 'blank');
  const readyTests = (o.tests||[]).map(tid=>{
    const t = db.tests.find(x=>x.id===tid);
    if(!t) return null;
    const res = (o.results&&o.results[tid])||{};
    if(!testHasResults(res, t)) return null;
    return {tid, t, res, meta: res._meta||null};
  }).filter(Boolean);

  if(!readyTests.length) return null;

  // Group by scientist (same signatory merge)
  const groups = [];
  const map = new Map();
  readyTests.forEach(item=>{
    const key = item.meta?.by || '_unknown';
    if(!map.has(key)){
      const g = {key, meta: item.meta, items:[]};
      map.set(key, g);
      groups.push(g);
    }
    map.get(key).items.push(item);
  });


  let body = '';
  if(useLh && db.letterhead) body += `<img class="lh-img" src="${db.letterhead}" alt="Letterhead">`;
  body += `<div class="report-body">`;
  body += `<div style="text-align:center;font-size:12pt;font-weight:700;margin:0 0 12px;letter-spacing:0.5px;border-bottom:1.5px solid #333;padding-bottom:6px">LABORATORY INVESTIGATION REPORT</div>`;
  body += `<div class="report-meta">
      <div><b>Patient:</b> ${e(p?.name||'—')}</div>
      <div><b>Order No:</b> ${e(o.oid)}</div>
      <div><b>Sex / Age:</b> ${e(ageSex(p))}</div>
      <div><b>Date:</b> ${e(o.date)}</div>
      <div><b>Patient ID:</b> ${e(p?.pid||'')}</div>
      <div><b>Status:</b> Validated &amp; released</div>
    </div>`;

  let sigHtml = '';
  groups.forEach(g=>{
    g.items.forEach(({t, res})=>{
      body += `<h4 style="margin:14px 0 4px;font-size:11pt;border-bottom:1px solid #666;padding-bottom:2px">${e(t.name)}</h4>
        <table><thead><tr><th>Parameter</th><th>Result</th><th>Unit</th><th>Flag</th><th>Reference</th></tr></thead><tbody>`;
      t.an.forEach(a=>{
        const val = res[a.n]??'';
        if(val===''||val==null) return; // only print entered parameters
        const fl = flag(val,a,p);
        const abn = isAbnormal(val,a);
        const flagTxt = fl||(abn?'A':'');
        const ref = refText(a,p);
        body += `<tr>
          <td>${e(a.n)}</td>
          <td class="${flagTxt}">${e(val)}</td>
          <td>${e(a.u||'')}</td>
          <td class="${flagTxt}">${flagTxt}</td>
          <td style="font-size:9pt">${e(ref)}</td>
        </tr>`;
      });
      body += `</tbody></table>`;
      if(res.Remark && !t.an.some(a=>a.n==='Remark')) body += `<p style="margin:4px 0;font-size:10pt"><b>Remark:</b> ${e(res.Remark)}</p>`;
    });
  });
  const v = o.validated||{};
  sigHtml = `<div class="sig-block">
        ${v.signature?`<img class="sig" src="${v.signature}" alt="Signature">`:''}
        <div class="name">${e(v.name||db.signer||'')}${v.initials?` (${e(v.initials)})`:''}</div>
        <div class="title">Medical Laboratory Scientist</div>
        <div style="font-size:8pt;margin-top:2px">Validated &amp; released ${v.at?new Date(v.at).toLocaleString():''}</div>
      </div>`;

  body += `<div class="report-footer">
    <div class="sig-row">${sigHtml}</div>
  </div>`;

  body += `</div>`; // report-body
  if(useLh && db.letterfoot) body += `<img class="lh-foot" src="${db.letterfoot}" alt="">`;
  return {html: body, useLh, readyCount: readyTests.length, total: (o.tests||[]).length};
}

async function printReport(id){
  if(!can('results.print')&&!can('*')&&!can('results.view')) return alert('Access denied');
  const o = db.orders.find(x=>x.id===id);
  if(!o) return;
  const p = await getPatient(o.pid);
  const built = buildReportHtml(o, p);
  if(!built) return alert(NOT_RELEASED(o));
  const reportEl = document.getElementById('report');
  reportEl.className = built.useLh ? 'with-lh' : '';
  reportEl.innerHTML = built.html;
  const prevTitle = document.title;
  document.title = safeFileName(p?.name||o.oid) + '_Lab_Report';
  log('REPORT_PRINT', `Printed ${built.readyCount}/${built.total} tests for order ${o.oid}`);
  window.print();
  setTimeout(()=>{ document.title = prevTitle; }, 500);
}

async function exportReport(id, format){
  if(!can('results.print')&&!can('*')&&!can('results.view')) return alert('Access denied');
  const o = db.orders.find(x=>x.id===id);
  if(!o) return;
  const p = await getPatient(o.pid);
  const built = buildReportHtml(o, p);
  if(!built) return alert(NOT_RELEASED(o));
  const reportEl = document.getElementById('report');
  reportEl.className = built.useLh ? 'with-lh' : '';
  reportEl.innerHTML = built.html;
  reportEl.style.display = 'block';
  const fname = safeFileName(p?.name||o.oid) + '_Lab_Report';
  if(format==='pdf'){
    const prevTitle = document.title;
    document.title = fname;
    log('REPORT_PDF', `Export PDF ${fname} order ${o.oid}`);
    window.print(); // user chooses "Save as PDF"
    setTimeout(()=>{ document.title = prevTitle; reportEl.style.display=''; }, 800);
    alert('In the print dialog, choose "Save as PDF" / "Microsoft Print to PDF" to download the file named after the patient.');
    return;
  }
  if(format==='jpg' || format==='png'){
    try{
      await document.fonts.ready;
      const canvas = await htmlToCanvas(reportEl);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', 0.92);
      a.download = fname + '.jpg';
      a.click();
      log('REPORT_JPG', `Export JPG ${fname} order ${o.oid}`);
    }catch(err){
      alert('Could not create image: '+(err.message||err));
    }
    reportEl.style.display = '';
  }
}

async function sendReport(id, format){
  if(!can('results.print')&&!can('*')&&!can('results.view')) return alert('Access denied');
  const o = db.orders.find(x=>x.id===id);
  if(!o) return;
  const p = await getPatient(o.pid);
  const built = buildReportHtml(o, p);
  if(!built) return alert(NOT_RELEASED(o));
  const reportEl = document.getElementById('report');
  reportEl.className = built.useLh ? 'with-lh' : '';
  reportEl.innerHTML = built.html;
  reportEl.style.display = 'block';
  const fname = safeFileName(p?.name||o.oid) + '_Lab_Report';
  try{
    await document.fonts.ready;
    const canvas = await htmlToCanvas(reportEl);
    const blob = await new Promise(res=> canvas.toBlob(res, format==='pdf'?'image/jpeg':'image/jpeg', 0.92));
    const file = new File([blob], fname + (format==='pdf'?'.jpg':'.jpg'), {type:'image/jpeg'});
    reportEl.style.display = '';
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        files: [file],
        title: 'Lab Report – '+(p?.name||''),
        text: `Laboratory report for ${p?.name||''} (${p?.pid||''}) order ${o.oid}`
      });
      log('REPORT_SEND', `Shared report order ${o.oid}`);
    } else {
      // fallback download + mailto tip
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
      alert('File downloaded as '+file.name+'.\\nAttach it in WhatsApp, Email or SMS to send to the patient.\\n(This browser does not support direct share with files.)');
      log('REPORT_SEND_DOWNLOAD', `Downloaded for send order ${o.oid}`);
    }
  }catch(err){
    reportEl.style.display = '';
    if(String(err.name)==='AbortError') return;
    alert('Send failed: '+(err.message||err));
  }
}

/* Report -> JPG, drawn in the browser (no server tools needed). */
async function htmlToCanvas(el){
  const W=794, SCALE=2;
  const st=document.createElement('style'); st.textContent=REPORT_CSS; document.head.appendChild(st);
  const prev=el.getAttribute('style');
  el.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const H=Math.max(el.scrollHeight,600);
  const clone=el.cloneNode(true); clone.removeAttribute('style'); clone.style.width=W+'px';
  const ser=new XMLSerializer().serializeToString(clone);
  st.remove(); if(prev===null) el.removeAttribute('style'); else el.setAttribute('style',prev);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${REPORT_CSS}</style>${ser}</div></foreignObject></svg>`;
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);   // a data: address keeps the canvas readable; a blob: address would taint it
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('The report image could not be drawn.')); i.src=url; });
    const c=document.createElement('canvas'); c.width=W*SCALE; c.height=H*SCALE;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.scale(SCALE,SCALE); ctx.drawImage(img,0,0,W,H); return c;
  } finally { /* nothing to release */ }
}

function saveNewTest(){
  if(!can('*')) return;
  const name=document.getElementById('tn').value.trim();
  const price=Math.max(0,parseFloat(document.getElementById('tp').value)||0);
  if(!name) return alert('Enter a test name');
  const rows=[...document.querySelectorAll('#paramRows > .f')];
  if(!rows.length) return alert('Add at least one parameter');
  const an=[];
  for(const row of rows){
    const pn=row.querySelector('.pr-name').value.trim();
    if(!pn) return alert('Each parameter needs a name');
    const typ=row.querySelector('.pr-type').value;
    if(typ==='n'){
      const unit=row.querySelector('.pr-unit').value.trim();
      const lo=parseFloat(row.querySelector('.pr-lo').value);
      const hi=parseFloat(row.querySelector('.pr-hi').value);
      an.push(N(pn, unit, [['',0,200, isNaN(lo)?null:lo, isNaN(hi)?null:hi]]));
    } else if(typ==='s'){
      let opts=row.querySelector('.pr-opts').value.split(',').map(s=>s.trim()).filter(Boolean);
      if(!opts.length) opts=['Non-Reactive','Reactive','Indeterminate'];
      // ensure Indeterminate present for typical reactive panels
      const low=opts.map(o=>o.toLowerCase());
      if((low.includes('reactive')||low.includes('positive')) && !low.includes('indeterminate'))
        opts.push('Indeterminate');
      const abn = opts.filter(o=>/reactive|positive/i.test(o) && !/non/i.test(o));
      an.push(S(pn, opts, abn));
    } else {
      an.push(T(pn));
    }
  }
  const id=name.toLowerCase().replace(/\W+/g,'-')+'-'+uid().slice(-4);
  if(db.tests.some(x=>x.name.toLowerCase()===name.toLowerCase())) return alert('A test with this name already exists');
  db.tests.push({id, name, an, price});
  log('TEST_ADD', `${name} (${an.length} parameter(s)) @ ${money(price)}`);
  persist(); closeDlg(); render();
}

/* ---------- Quality Control (Levey-Jennings + Westgard) ---------- */
let qcSel=null;
const qcRuns=id=>db.qc.runs.filter(r=>r.mid===id).sort((a,b)=>a.ts<b.ts?-1:1);
const qcLast=m=>{const r=qcRuns(m.id);return r[r.length-1]};
/* Westgard multi-rule QC (ISO 15189 aligned internal QC)
   Reject rules: 1-3s, 2-2s, R-4s, 4-1s, 10x, 2of3-2s
   Warning: 1-2s (investigate trend; still reportable pending lab policy)
   ISO 15189:2022 requires documented acceptance criteria, corrective action
   when out of control, and that patient results are not released until resolved. */
function qcEval(pz,z){
  const a=[...pz,z], n=a.length, y=a[n-2], x=a[n-3], r=[], last=k=>a.slice(-k);
  // 1-3s: one control exceeds ±3 SD
  if(Math.abs(z)>3) r.push('1-3s');
  // 2-2s: two consecutive controls exceed same-side ±2 SD
  if(n>1 && ((z>2&&y>2)||(z<-2&&y<-2))) r.push('2-2s');
  // R-4s: two consecutive controls differ by >4 SD (opposite sides)
  if(n>1 && Math.abs(z-y)>4) r.push('R-4s');
  // 4-1s: four consecutive controls exceed same-side ±1 SD
  if(n>=4 && (last(4).every(v=>v>1)||last(4).every(v=>v<-1))) r.push('4-1s');
  // 10x: ten consecutive controls on the same side of the mean
  if(n>=10 && (last(10).every(v=>v>0)||last(10).every(v=>v<0))) r.push('10x');
  // 2of3-2s: two of the last three controls exceed same-side ±2 SD
  if(n>=3){
    const last3=last(3);
    if(last3.filter(v=>v>2).length>=2 || last3.filter(v=>v<-2).length>=2) r.push('2of3-2s');
  }
  if(r.length) return {s:'Reject', rule:r.join(', ')};
  // 1-2s warning only (not automatic reject)
  if(Math.abs(z)>2) return {s:'Warning', rule:'1-2s'};
  return {s:'Accept', rule:''};
}
function ljChart(rs){
  rs=rs.slice(-30);const W=640,H=240,L=40,R=10,T=10,B=14;
  const y=z=>T+(H-T-B)*(1-(Math.max(-4,Math.min(4,z))+4)/8),x=i=>L+(W-L-R)*(rs.length<2?.5:i/(rs.length-1));
  const col=k=>k===0?'#16a34a':Math.abs(k)===3?'#dc2626':Math.abs(k)===2?'#ca8a04':'#cbd5e1';
  let g='';[-3,-2,-1,0,1,2,3].forEach(k=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="${col(k)}" ${k?'stroke-dasharray="4 3"':''}/><text x="2" y="${y(k)+4}" font-size="11" fill="#486581">${k>0?'+':''}${k} SD</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;background:#fff;border:1px solid var(--line);border-radius:10px">${g}<polyline points="${rs.map((r,i)=>x(i)+','+y(r.z)).join(' ')}" fill="none" stroke="#0284c7" stroke-width="1.5"/>${rs.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.z)}" r="4" fill="${r.s==='Reject'?'#dc2626':r.s==='Warning'?'#ca8a04':'#0284c7'}"><title>${e(r.date)}: ${e(r.val)} (z ${r.z.toFixed(2)})</title></circle>`).join('')}</svg>`;
}

  return `<h2>Quality Control</h2><p class="muted"><b>Westgard multi-rule</b> (ISO 15189 internal QC):

  <div class="tw"><table><thead><tr><th>Control</th><th>Analyte</th><th>Target</th><th>Lot / expiry</th><th>Last result</th><th>Status</th><th></th></tr></thead><tbody>

  ${sel?`<h3>${e(sel.name)} – ${e(sel.an)}</h3>${ljChart(qcRuns(sel.id))}<div class="tw" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Value</th><th>z</th><th>Result</th><th>Rule</th><th>Corrective action</th><th>By</th></tr></thead><tbody>${qcRuns(sel.id).slice(-10).reverse().map(r=>`<tr><td>${e(r.date)}</td><td>${e(r.val)}</td><td>${r.z.toFixed(2)}</td><td><span class="tag ${r.s==='Reject'?'Reject':r.s==='Warning'?'Progress':'Completed'}">${r.s}</span></td><td>${e(r.rule)}</td><td style="white-space:normal">${e(r.act||'')}</td><td>${e(r.by)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No results yet</td></tr>'}</tbody></table></div>`:''}`;
}

function saveQC(id){
  const m=db.qc.mats.find(x=>x.id===id);if(!m||(!can('qc.edit')&&!can('*')))return alert('Access denied');
  const v=parseFloat(document.getElementById('qv').value);if(isNaN(v))return alert('Enter the measured value');
  const z=(v-m.mean)/m.sd,ev=qcEval(qcRuns(id).map(x=>x.z),z),act=document.getElementById('qact').value.trim();
  if(ev.s==='Reject'&&!act)return alert('Rejected by rule '+ev.rule+'. Do not report patient results for this analyte until resolved. Enter the corrective action taken, then save.');
  db.qc.runs.push({id:uid(),mid:id,date:document.getElementById('qd').value||today(),val:v,z,s:ev.s,rule:ev.rule,act,by:session.username,ts:nowISO()});
  log('QC_RESULT',`${m.name} ${m.an}: ${v} (z ${z.toFixed(2)}) ${ev.s}${ev.rule?' '+ev.rule:''}`);

  const demo = CONFIG.demo ? `<div class="alert warn"><b>Demo server.</b> Data may be erased at any time. Use test data only.</div>` : '';
  if(!SUB) return demo;
  const adm=session&&session.role==='admin', go=adm?` <a href="#" onclick="page='subscription';render();return false">Open Subscription</a>`:' Please tell your administrator.';
  if(SUB.status==='expired') return demo+`<div class="alert warn"><b>Subscription expired.</b> The system is now read-only: nothing new can be saved.${go}</div>`;
