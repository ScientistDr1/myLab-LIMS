async function viewSubscription(){
  if(session.role!=='admin') return '<p class="empty">Access denied</p>';
  let s; try{ s=await api('/sub'); SUB=s; }catch(ex){ return '<p class="empty">'+e(ex.message)+'</p>'; }
  const lab={trial:'Free trial',active:'Active',expired:'Expired',suspended:'Suspended'}[s.status]||s.status;
  return `<h2>Subscription</h2>
  <div class="st"><div><b>${e(lab)}</b>Status</div><div><b>${e(s.plan==='trial'?'Trial':s.plan)}</b>Plan</div><div><b>${new Date(s.until*1000).toLocaleString()}</b>${s.status==='expired'?'Expired on':'Valid until'}</div></div>
  <h3>Renew or change plan</h3>
  <div class="tw"><table><thead><tr><th>Plan</th><th>Length</th><th>Price</th><th></th></tr></thead><tbody>
  ${s.plans.map(p=>`<tr><td><b>${e(p.name)}</b></td><td>${p.days} day${p.days>1?'s':''}</td><td>${p.price>0?money(p.price):'<span class="muted">Not available yet</span>'}</td>
  <td class="actions">${p.price>0?`<button class="b" onclick="payTransfer('${p.id}')">Pay by bank transfer</button>${s.paystack?` <button class="b g" onclick="payOnline('${p.id}')">Pay online</button>`:''}`:''}</td></tr>`).join('')}</tbody></table></div>
  <p class="muted">A new payment adds time to what you have left; nothing is lost. Bank-transfer payments are activated when the platform owner confirms them.</p>
  ${s.support?`<p class="muted">Payment help: ${e(s.support)}</p>`:''}
  <h3>Payment history</h3>
  <div class="tw"><table><thead><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Method</th><th>Reference</th><th>Status</th></tr></thead><tbody>
  ${s.history.length?s.history.map(h=>`<tr><td>${new Date(h.created*1000).toLocaleDateString()}</td><td>${e(h.plan)}</td><td>${money(h.amount)}</td><td>${e(h.method)}</td><td>${e(h.ref)}</td><td><span class="tag ${h.status==='paid'?'Completed':h.status==='pending'?'Progress':'Pending'}">${e(h.status)}</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No payments yet</td></tr>'}</tbody></table></div>`;
}
function payTransfer(plan){
  openDlg(`<h3>Pay by bank transfer</h3><p>Optional: your transfer reference or the name on the sending account, so the owner can match your payment.</p>
  <div class="f"><div class="full"><input id="pnote" placeholder="e.g. sender name or reference"></div></div>
  <div class="bar" style="margin-top:14px"><button class="b" onclick="sendTransfer('${plan}')">Get payment details</button><button class="b g" data-close>Cancel</button></div>`);
}
async function sendTransfer(plan){
  try{
    const r=await api('/sub/request',{plan,note:document.getElementById('pnote').value.trim()});
    openDlg(`<h3>Payment request created</h3><p>Pay <b>${money(r.amount)}</b> for the <b>${e(r.plan)}</b> plan, using this reference: <b>${e(r.ref)}</b></p>
    <div class="alert" style="white-space:pre-wrap">${e(r.bank||'The owner has not added bank details yet. Please contact the platform owner.')}</div>
    <p class="muted">When the owner confirms your transfer, your plan is activated automatically.</p><div class="bar"><button class="b" data-close>Done</button></div>`);
    render();
  }catch(ex){ alert(ex.message); }
}
async function payOnline(plan){ try{ const r=await api('/sub/paystack',{plan}); location.href=r.url; }catch(ex){ alert(ex.message); } }
/* ---------- Review round: dashboard drill-down, rejection, validation, login helpers ---------- */
let ordFilter='';
const FILTERS={today:"Patients today (today's orders)",samples:'Samples received today',pending:'Pending tests',validation:'Awaiting validation',overdue:'Overdue results',rejected:'Rejected samples'};
function goDash(f){ ordFilter=f; page=(['pending','validation','overdue'].includes(f)&&(can('results.edit')||can('*')))?'results':'orders'; render(); }
function filterOrders(list){
  if(!ordFilter) return list; const td=today();
  const fn={today:o=>o.date===td, samples:o=>o.sample&&o.sample.collected&&String(o.sample.collectedAt||'').slice(0,10)===td,
    pending:o=>statusOf(o)==='Pending', validation:o=>statusOf(o)==='Validation', overdue:o=>isOverdue(o), rejected:o=>statusOf(o)==='Rejected'}[ordFilter];
  return fn?list.filter(fn):list;
}
function filterBar(){ return ordFilter?`<div class="alert info" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>Showing: <b>${e(FILTERS[ordFilter]||ordFilter)}</b></span><button class="b g" onclick="ordFilter='';render()">Clear filter</button></div>`:''; }
const NOT_RELEASED=o=>o.validated?'There are no results to include in this report.':'This report is not released yet. A Medical Laboratory Scientist must validate the results first.';
const REJECT_REASONS=['Haemolysed specimen','Insufficient volume','Insufficient / incorrect patient data','Incorrect container or anticoagulant','Clotted specimen','Contaminated or leaking container','Unlabelled or mislabelled specimen','Delayed delivery / unstable sample','Other'];
function rejectDlg(id){
  if(!can('orders.reject')&&!can('*')) return alert('Access denied');
  const o=db.orders.find(x=>x.id===id); if(!o) return;
  openDlg(`<h3>Reject sample – ${e(o.oid)}</h3><p class="muted">A reason is required. It is saved on the order and shown to everyone who tracks it.</p>
  <div class="f"><div class="full"><label>Reason *</label><select id="rj_r"><option value="">Select a reason…</option>${REJECT_REASONS.map(r=>`<option>${e(r)}</option>`).join('')}</select></div>
  <div class="full"><label>Remark * (what exactly was wrong, and what should be done)</label><textarea id="rj_t" rows="3" style="width:100%"></textarea></div></div>
  <div class="fe" id="rj_e" role="alert"></div>
  <div class="bar" style="margin-top:14px"><button class="b d" onclick="saveReject('${id}')">Reject sample</button><button class="b g" data-close>Cancel</button></div>`);
}
function saveReject(id){
  if(!can('orders.reject')&&!can('*')) return alert('Access denied');
  const o=db.orders.find(x=>x.id===id); if(!o) return;
  const r=document.getElementById('rj_r').value, t=document.getElementById('rj_t').value.trim(), er=document.getElementById('rj_e');
  if(!r){ er.textContent='Select a reason for the rejection.'; return; }
  if(t.length<5){ er.textContent='Write a remark of at least a few words explaining the rejection.'; return; }
  o.rejected={reason:r,remark:t,by:session.username,name:session.name||session.username,at:nowISO()};
  o.updated=nowISO(); o.updatedBy=session.username;
  log('SAMPLE_REJECT',`Order ${o.oid}: ${r} – ${t}`.slice(0,300)); persist(); closeDlg(); render();
}
function undoReject(id){
  if(!can('results.validate')&&!can('*')) return alert('Only a Medical Laboratory Scientist can undo a rejection.');
  const o=db.orders.find(x=>x.id===id); if(!o||!confirm('Undo the rejection of '+o.oid+'? The order goes back into the queue.')) return;
  o.rejected=null; o.updated=nowISO(); o.updatedBy=session.username; log('SAMPLE_REJECT_UNDO',`Order ${o.oid}`); persist(); render();
}
function validateOrder(id){
  if(!can('results.validate')&&!can('*')) return alert('Only a Medical Laboratory Scientist can validate and release results.');
  const o=db.orders.find(x=>x.id===id); if(!o||o.validated) return;
  if(!confirm('Validate and release this result?\n\nYour name and signature will be placed on the report and the results will be locked.')) return;
  saveResults(id);
  if(!hasResults(o)) return alert('There are no results to validate yet.');
  o.validated={by:session.username,name:session.name||session.username,initials:session.initials||'',signature:session.signature||'',at:nowISO()};
  o.updated=nowISO(); o.updatedBy=session.username;
  log('RESULT_VALIDATE',`Validated and released order ${o.oid}`); persist(); render();
}
function revokeValidation(id){
  if(!can('results.validate')&&!can('*')) return alert('Only a Medical Laboratory Scientist can revoke validation.');
  const o=db.orders.find(x=>x.id===id); if(!o||!o.validated||!confirm('Revoke the validation of '+o.oid+'? The report is withdrawn until it is validated again.')) return;
  o.validated=null; o.updated=nowISO(); o.updatedBy=session.username; log('RESULT_VALIDATION_REVOKED',`Order ${o.oid}`); persist(); closeDlg(); render();
}
function setTat(id,v){
  if(!can('*')) return; const t=db.tests.find(x=>x.id===id), n=Math.max(1,parseFloat(v)||24);
  log('TEST_TAT',`${t.name}: ${tatOf(t)}h → ${n}h`); t.tat=n; persist(); render();
}
/* password reset requests (administrator side) */
function resetBannerHtml(){
  if(!session||session.role!=='admin'||!db.resetreq||!db.resetreq.length) return '';
  return `<div class="alert warn"><b>Password reset requested:</b><br>${db.resetreq.map(r=>`${e(r.name||r.username)} (${e(r.username)}) – <a href="#" onclick="resetFor('${e(r.username)}');return false">set a temporary password</a> · <a href="#" onclick="dismissReset('${e(r.id)}');return false">dismiss</a>`).join('<br>')}</div>`;
}
function resetFor(un){ const u=db.users.find(x=>x.username===un); if(u) editUser(u.id); }
function dismissReset(id){ db.resetreq=db.resetreq.filter(r=>r.id!==id); persist(); render(); }
function forgotDlg(){
  openDlg(`<h3>Forgot your password?</h3>
  <p><b>Staff:</b> enter your facility code and username. Your facility administrator is notified and can set a temporary password for you on the Users page.</p>
  <div class="f"><div><label>Facility code</label><input id="fp_f" value="${e(localStorage.getItem('lims_fac')||'')}" autocapitalize="none"></div><div><label>Username</label><input id="fp_u" autocapitalize="none"></div></div>
  <div class="fe" id="fp_e" role="alert"></div>
  <p class="muted"><b>Facility administrators:</b> please contact the platform owner to reset your password${CONFIG.support?' ('+e(CONFIG.support)+')':''}.</p>
  <div class="bar"><button class="b" onclick="sendReset()">Notify my administrator</button><button class="b g" data-close>Cancel</button></div>`);
}
async function sendReset(){
  const f=document.getElementById('fp_f').value.trim().toLowerCase(), u=document.getElementById('fp_u').value.trim().toLowerCase(), er=document.getElementById('fp_e');
  if(!f){ er.textContent='Enter your facility code.'; return; } if(!u){ er.textContent='Enter your username.'; return; }
  try{ await api('/reset-request',{facility:f,username:u});
    openDlg(`<h3>Request sent</h3><p>If that account exists, your facility administrator has been notified. Ask them to set a temporary password for you, then sign in and change it from the menu.</p><div class="bar"><button class="b" data-close>OK</button></div>`);
  }catch(ex){ er.textContent=ex.status===429?ex.message:'Could not send the request. Please try again.'; }
}
function loginMsg(ex){
  if(ex.status===401||ex.status===400) return 'Invalid facility code or login details.';
  if(ex.status===403||ex.status===429) return ex.message;
  if(!ex.status) return 'Cannot reach the server. Check your internet connection and try again.';
  return 'Something went wrong. Please try again.';
}
/* show / hide password on every password box */
const SVG_ATTR='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const EYE=`<svg ${SVG_ATTR}><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF=`<svg ${SVG_ATTR}><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.5 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10.4 10.4 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
function eyeify(){
  document.querySelectorAll('input[type=password]:not([data-eye])').forEach(inp=>{
    inp.dataset.eye='1'; const w=document.createElement('span'); w.className='pw-wrap'; inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    const b=document.createElement('button'); b.type='button'; b.className='pw-eye'; b.innerHTML=EYE; b.setAttribute('aria-label','Show password'); b.title='Show password';
    b.onclick=()=>{ const s=inp.type==='password'; inp.type=s?'text':'password'; b.innerHTML=s?EYE_OFF:EYE; b.setAttribute('aria-label',s?'Hide password':'Show password'); b.title=s?'Hide password':'Show password'; inp.focus(); };
    w.appendChild(b);
  });
}
new MutationObserver(eyeify).observe(document.body,{childList:true,subtree:true}); eyeify();
/* registration (facility code is generated by the server) */
function regDlg(){
  openDlg(`<h3>Register your facility</h3><p class="muted">You become the facility administrator. A unique facility code is created for you automatically. You then add your staff and choose their roles.</p>
  <div class="f"><div class="full"><label>Facility name *</label><input id="rn" autocomplete="organization"></div>
  <div><label>Phone</label><input id="rp" type="tel" autocomplete="tel"></div><div><label>Email</label><input id="re" type="email" autocomplete="email"></div>
  <div class="full"><label>Your full name *</label><input id="rf" autocomplete="name"></div>
  <div><label>Choose a username *</label><input id="ru" autocapitalize="none" autocomplete="username"></div><div><label>Choose a password * (8+ characters)</label><input id="rw" type="password" autocomplete="new-password"></div></div>
  ${(CONFIG.privacy||CONFIG.terms)?`<label style="display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--ink)"><input type="checkbox" id="ragree" style="width:auto;min-height:0;margin-top:3px"><span>I agree to the ${CONFIG.privacy?'<a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>':''}${CONFIG.privacy&&CONFIG.terms?' and ':''}${CONFIG.terms?'<a href="/terms" target="_blank" rel="noopener">Terms of Service</a>':''}.</span></label>`:''}
  <div class="fe" id="rerr" role="alert"></div>
  <div class="bar" style="margin-top:14px"><button class="b" onclick="doRegister()">Create facility</button><button class="b g" data-close>Cancel</button></div>`);
}
async function doRegister(){
  const g=id=>document.getElementById(id).value.trim(), er=document.getElementById('rerr'), pw=document.getElementById('rw').value;
  const bad=m=>{ er.textContent=m; return null; };
  if(g('rn').length<3) return bad('Enter the facility name (at least 3 characters).');
  if(!g('rf')) return bad('Enter your full name.');
  if(g('re')&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('re'))) return bad('That email address does not look right.');
  if(!/^[a-z0-9._-]{3,32}$/i.test(g('ru'))) return bad('Username: 3 to 32 letters, numbers, dot, dash or underscore.');
  if(pw.length<8) return bad('Password must be at least 8 characters.');
  const ag=document.getElementById('ragree'); if(ag&&!ag.checked) return bad('Please tick the box to accept the Privacy Policy and Terms.');
  er.textContent='';
  try{
    const r=await api('/register',{name:g('rn'),phone:g('rp'),email:g('re'),fullname:g('rf'),username:g('ru'),password:pw,agree:!!(ag&&ag.checked)});
    TOKEN=r.token; sessionStorage.setItem('lims_tok',TOKEN); session=r.user; localStorage.setItem('lims_fac',r.facility);
    await startApp(); regDone(r.facility_code);
  }catch(ex){ er.textContent=(ex.status&&ex.status<500)?ex.message:'Something went wrong. Please try again.'; }
}
function regDone(code){
  openDlg(`<div style="text-align:center"><h3 style="color:#166534;margin-top:0">Registration Successful!</h3>
  <p>Your unique Facility Code is:</p>
  <div id="newcode" style="font-size:36px;font-weight:800;letter-spacing:2px;background:#ecfdf5;border:2px dashed #16a34a;border-radius:12px;padding:14px;user-select:all">${e(code)}</div>
  <p style="margin-top:14px">Please give this code to your staff so they can use it to sign in.</p>
  <p class="muted">Keep a copy. You can always see it in the menu. If you ever forget it, the platform owner can send it to you.</p>
  <div class="bar" style="justify-content:center"><button class="b g" onclick="copyCode('${e(code)}')">Copy code</button><button class="b" data-close>Continue to my dashboard</button></div></div>`);
}
function copyCode(c){ if(navigator.clipboard) navigator.clipboard.writeText(c).then(()=>alert('Code copied: '+c)); else alert('Facility code: '+c); }

/* ---------- Help & support, privacy policy and terms ---------- */
const digitsOf=v=>String(v||'').replace(/\D/g,'');
function contactHtml(c){
  const wa=digitsOf(c.support_whatsapp), ph=String(c.support_phone||'').trim(), em=String(c.support_email||'').trim(), items=[];
  if(wa) items.push(`<a class="b" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp us</a>`);
  if(ph) items.push(`<a class="b g" href="tel:${e(ph.replace(/[^+\d]/g,''))}">Call ${e(ph)}</a>`);
  if(em) items.push(`<a class="b g" href="mailto:${e(em)}">Email ${e(em)}</a>`);
  const extra=(c.support_hours?`<div class="muted">Support hours: ${e(c.support_hours)}</div>`:'')+(c.support?`<div class="muted" style="white-space:pre-wrap">${e(c.support)}</div>`:'');
  return ((items.length?`<div style="margin:8px 0 2px">${items.join('')}</div>`:'')+extra)||'<p class="muted">Support contact details have not been added yet.</p>';
}
function supportDlg(){
  openDlg(`<h3>Need help?</h3>${contactHtml(CONFIG)}<p class="muted">If you cannot sign in, contact support with your facility name and username. Never send anyone your password.</p><div class="bar"><button class="b g" data-close>Close</button></div>`);
}
function fillLoginLinks(){
  const el=document.getElementById('login-links'); if(!el) return;
  const l=['<a href="#" onclick="supportDlg();return false">Need help? Contact support</a>'];
  if(CONFIG.privacy) l.push('<a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>');
  if(CONFIG.terms) l.push('<a href="/terms" target="_blank" rel="noopener">Terms of Service</a>');
  el.innerHTML=l.join(' &middot; ');
}
function legalFooter(){
  const l=[`<a href="#" onclick="page='support';render();return false">Help &amp; Support</a>`];
  if(CONFIG.privacy) l.push('<a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>');
  if(CONFIG.terms) l.push('<a href="/terms" target="_blank" rel="noopener">Terms of Service</a>');
  return `<div class="muted" style="margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:13px">${l.join(' &middot; ')}</div>`;
}
async function viewSupport(){
  let d; try{ d=await api('/support'); }catch(ex){ return '<p class="empty">'+e(ex.message)+'</p>'; }
  const cats=['Cannot sign in / password','Subscription or payment','Something is not working (bug)','How do I...? (training)','Suggestion','Other'];
  return `<h2>Help &amp; Support</h2>
  <div class="alert"><b>Talk to us</b>${contactHtml(d.contact)}</div>
  <h3>Send a support request</h3>
  <div class="f" style="max-width:640px"><div class="full"><label>What is it about?</label><select id="tk_c">${cats.map(c=>`<option>${e(c)}</option>`).join('')}</select></div>
  <div class="full"><label>Subject *</label><input id="tk_s" maxlength="120"></div>
  <div class="full"><label>Describe the problem *</label><textarea id="tk_b" rows="5" maxlength="3000"></textarea></div></div>
  <p class="muted" style="max-width:640px">Do not include patient names, results or your password. Say what you were doing, what you expected and what happened.</p>
  <div class="fe" id="tk_e" role="alert"></div><p><button class="b" onclick="sendTicket()">Send request</button></p>
  <h3>${session.role==='admin'?"Your facility's requests":'Your requests'}</h3>
  <div class="tw"><table><thead><tr><th>Sent</th><th>Subject</th><th>Status</th><th>Reply from support</th></tr></thead><tbody>
  ${d.tickets.length?d.tickets.map(t=>`<tr><td>${new Date(t.created*1000).toLocaleString()}</td><td style="white-space:normal;max-width:260px"><b>${e(t.subject)}</b><div class="muted">${e(t.cat)}${session.role==='admin'?' &middot; '+e(t.name):''}</div></td><td><span class="tag ${t.status==='closed'?'Completed':'Progress'}">${t.status==='closed'?'Resolved':'Open'}</span></td><td style="white-space:normal;max-width:320px">${t.reply?e(t.reply):'<span class="muted">Waiting for a reply</span>'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No requests yet</td></tr>'}</tbody></table></div>`;
}
async function sendTicket(){
  const er=document.getElementById('tk_e'), s=document.getElementById('tk_s').value.trim(), b=document.getElementById('tk_b').value.trim(); er.textContent='';
  if(s.length<3){ er.textContent='Enter a short subject.'; return; }
  if(b.length<10){ er.textContent='Please describe the problem in a sentence or two.'; return; }
  try{ await api('/support/ticket',{cat:document.getElementById('tk_c').value,subject:s,body:b}); alert('Your request was sent. You will see the reply on this page.'); render(); }
  catch(ex){ er.textContent=(ex.status&&ex.status<500)?ex.message:'Something went wrong. Please try again.'; }
}

/* ---------- Boot ---------- */
(async function boot(){
  try{ CONFIG=await (await fetch('/api/config')).json(); }catch(_){}
  document.getElementById('demo-note').style.display=CONFIG.demo?'block':'none'; fillLoginLinks();
  document.getElementById('lf').value=localStorage.getItem('lims_fac')||'';
  document.getElementById('lp').addEventListener('keydown',ev=>{ if(ev.key==='Enter') doLogin(); });
  document.getElementById('lu').addEventListener('keydown',ev=>{ if(ev.key==='Enter') document.getElementById('lp').focus(); });
  window.addEventListener('beforeunload',ev=>{ if(dirty){ ev.preventDefault(); ev.returnValue=''; } });
  if(TOKEN){ try{ session=await api('/me'); await startApp(); }catch(_){ session=null; } }
})();
</script>
